name: CI

# Los cuatro gates del proyecto, corridos por una máquina en cada PR.
#
# Existe sobre todo por los PRs de fuera: quien manda uno no tiene la base de
# datos ni el `.env` de nadie, así que hoy la única forma de saber si su cambio
# sirve es que un humano lo clone y lo corra a mano. Con esto, el resultado
# llega pegado al PR y el colaborador lo ve antes que el mantenedor.
on:
  pull_request:
  push:
    branches: [main]

# Tres pushes seguidos a un PR no necesitan tres corridas: manda la última.
# En `main` no se cancela nada — ahí el historial de qué pasó importa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Solo lectura: ninguno de estos pasos escribe en el repo, y un PR desde un
# fork ajeno no debe recibir un token que pueda hacerlo.
permissions:
  contents: read

jobs:
  gates:
    name: ${{ matrix.config.name }} · typecheck · lint · test · build
    runs-on: ubuntu-latest

    # Los módulos opcionales (canales, agenda) se encienden con variables de
    # despliegue, así que el código que viaja en main tiene que servir en las
    # dos configuraciones — y eso no se sabe corriendo solo una.
    #
    # `default` es lo que instala la mayoría: sin canales extra y sin agenda.
    # `completo` es todo encendido. Entre las dos se cubre lo que las banderas
    # prometen: que apagadas no estorban y encendidas funcionan.
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: default
            channels: ""
            agenda: ""
          - name: completo
            channels: "whatsapp,instagram,messenger,tiktok"
            agenda: "on"

    env:
      CHANNELS: ${{ matrix.config.channels }}
      AGENDA: ${{ matrix.config.agenda }}

    steps:
      - uses: actions/checkout@v7

      # Antes que setup-node, porque su caché necesita pnpm ya instalado.
      # La versión sale de `packageManager` en package.json y no se repite
      # aquí: duplicarla es tenerla desactualizada en uno de los dos lados.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile` falla si el lockfile no cuadra con package.json,
      # en vez de resolver otras versiones en silencio y probar algo que nadie
      # va a instalar.
      - name: install
        run: pnpm install --frozen-lockfile

      # Los cuatro corren AUNQUE uno falle. Es a propósito: si se detuviera en
      # el primero, arreglar tres cosas costaría tres vueltas de ida y vuelta a
      # alguien que no puede reproducirlas en su máquina. Una corrida, la lista
      # completa.
      - name: typecheck
        run: pnpm typecheck

      - name: lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: test
        if: ${{ !cancelled() }}
        run: pnpm test

      # Va al final porque es el más lento, y porque ya atrapó cosas que los
      # otros tres no ven: Next rechaza exports que no son handlers en un
      # `route.ts`, y eso solo aparece al construir.
      - name: build
        if: ${{ !cancelled() }}
        run: pnpm build

  multitenant-e2e:
    name: multitenant · PostgreSQL · dos empresas
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: conectapro_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d conectapro_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:local-test-only@localhost:5432/conectapro_test
      APP_BASE_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ci-local-multitenant-auth-secret-only
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      META_WEBHOOK_VERIFY_TOKEN: ci-local-webhook-token
      META_APP_SECRET: ci-local-meta-secret
      BOT_API_KEY: global-key-that-must-not-be-accepted
      OPENROUTER_API_TOKEN: global-test-llm-key
      OPENROUTER_MODEL: test-global-model
      MULTITENANT: "true"
      PLATFORM_ADMIN_USER_IDS: multitenant-test-admin
      WA_MOCK_ENABLED: "true"
      CHANNELS: whatsapp,instagram,messenger,tiktok
      AGENDA: "on"
      MEDIA_DIR: /tmp/conectapro-test-media
      E2E_ADMIN_EMAIL: admin@local.test
      E2E_ADMIN_PASSWORD: Local-ci-test-password-2026
      WATCHPACK_POLLING: "1000"
      AGENT_COALESCE_MS: "500"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrar y crear administrador de pruebas
        run: |
          MIGRATIONS_DIR=./drizzle node scripts/migrate.mjs
          node scripts/seed-multitenant-test.mjs
      - name: Arrancar aplicación y verificar dos empresas
        run: |
          pnpm dev --port 3100 > /tmp/conectapro-app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID"' EXIT
          for i in $(seq 1 120); do
            if curl --fail --silent http://localhost:3100/api/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/e2e-multitenant.mjs
      - name: Log de aplicación si falla
        if: failure()
        run: tail -200 /tmp/conectapro-app.log
